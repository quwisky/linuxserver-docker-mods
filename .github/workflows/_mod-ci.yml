name: Mod CI

# Read-only reusable validation. Publication lives in _mod-publish.yml so pull
# request code can never inherit a package-write or attestation token.
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      mod:
        required: true
        type: string
      platforms:
        required: false
        default: linux/amd64,linux/arm64
        type: string
      source-ref:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.app }}-${{ inputs.mod }} / test
    runs-on: ubuntu-latest
    env:
      DIR: mods/${{ inputs.app }}/${{ inputs.mod }}
      ID: ${{ inputs.app }}-${{ inputs.mod }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: mod directory exists and is shaped like a mod
        run: |
          rc=0
          [[ -f "${DIR}/Dockerfile" ]] || { echo "::error::${ID}: no Dockerfile"; rc=1; }
          [[ -f "${DIR}/README.md" ]] || { echo "::error::${ID}: no README.md"; rc=1; }
          [[ -f "${DIR}/VERSION" ]] || { echo "::error::${ID}: no VERSION"; rc=1; }
          [[ -f "${DIR}/CHANGELOG.md" ]] || { echo "::error::${ID}: no CHANGELOG.md"; rc=1; }
          [[ -d "${DIR}/root/etc/s6-overlay/s6-rc.d" ]] || { echo "::error::${ID}: no s6-rc.d"; rc=1; }
          exit "${rc}"

      - name: s6 scripts must be executable
        run: |
          bad="$(find "${DIR}" \( -name run -o -name finish -o -name check \) -not -perm -u=x,g=x,o=x -print)"
          [[ -z ${bad} ]] || { printf '::error::non-executable s6 files:\n%s\n' "${bad}"; exit 1; }

      - name: every service must have a type and user registration
        run: |
          directory="${DIR}/root/etc/s6-overlay/s6-rc.d"
          rc=0
          for service in "${directory}"/*/; do
            name="$(basename "${service%/}")"
            case "${name}" in user | user2 | init-mods* | legacy-services) continue ;; esac
            [[ -f "${service}type" ]] || { echo "::error::${name} has no type"; rc=1; }
            ls "${directory}"/user*/contents.d/"${name}" >/dev/null 2>&1 || {
              echo "::error::${name} is not registered in user/contents.d"; rc=1;
            }
          done
          exit "${rc}"

      - name: s6 files must be UTF-8 with LF and no BOM
        run: |
          rc=0
          if crlf="$(grep -rlU $'\r' "${DIR}/root/" || true)" && [[ -n ${crlf} ]]; then
            printf '::error::CRLF files:\n%s\n' "${crlf}"; rc=1
          fi
          if bom="$(LC_ALL=C grep -rl $'\xEF\xBB\xBF' "${DIR}/root/" || true)" && [[ -n ${bom} ]]; then
            printf '::error::BOM files:\n%s\n' "${bom}"; rc=1
          fi
          exit "${rc}"

      - name: shellcheck
        run: |
          mapfile -t files < <(find "${DIR}" -type f \( -name run -o -name finish -o -name check -o -name '*.sh' \) | sort)
          ((${#files[@]} == 0)) || shellcheck -x "${files[@]}"

      - name: unit tests
        run: |
          test_file="${DIR}/test/run_tests.sh"
          [[ -f ${test_file} ]] || exit 0
          bash "${test_file}"
          NO_JQ=1 bash "${test_file}"

      - name: validate Caddy stubs
        run: |
          directory="${DIR}/test/stubs"
          if [[ ! -d ${directory} ]] || ! compgen -G "${directory}/Caddyfile.*" >/dev/null; then exit 0; fi
          docker run --rm -v "$PWD/${directory}:/s:ro" -w /s --entrypoint sh caddy:2-alpine -c '
            rc=0
            for file in Caddyfile.*; do caddy validate --adapter caddyfile --config "$file" || rc=1; done
            exit $rc'

      - name: end-to-end smoke test
        run: |
          smoke="${DIR}/test/smoke.sh"
          [[ -f ${smoke} ]] || exit 0
          bash "${smoke}"

      - uses: docker/setup-buildx-action@v4

      - name: build and verify the local layer
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          docker buildx build --load --provenance=false \
            --platform "${PLATFORMS%%,*}" -f "${DIR}/Dockerfile" -t "local/${ID}:test" .
          layers="$(docker image inspect "local/${ID}:test" --format '{{len .RootFS.Layers}}')"
          [[ ${layers} == 1 ]] || { echo "::error::${ID} produced ${layers} layers"; exit 1; }
          docker create --name probe "local/${ID}:test" /nonexistent >/dev/null
          trap 'docker rm -f probe >/dev/null 2>&1 || true' EXIT
          docker export probe | tar -tf - \
            | grep -vE '^(dev|proc|sys)/|^\.dockerenv$|^etc/(hostname|hosts|mtab|resolv.conf)$|/$' | sort
