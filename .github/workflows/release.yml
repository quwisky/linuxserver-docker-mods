name: Release

on:
  push:
    branches: [master]
    paths: [.release/plan.json]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Read authorized release plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        run: |
          python3 ci/release.py verify-plan --owner "${GITHUB_REPOSITORY_OWNER,,}"
          source_sha="$(jq -r .source_sha .release/plan.json)"
          git merge-base --is-ancestor "${source_sha}" "${GITHUB_SHA}" || {
            echo "::error::release plan source ${source_sha} is not an ancestor of ${GITHUB_SHA}"; exit 1
          }
          matrix="$(jq -c '{include: .packages}' .release/plan.json)"
          count="$(jq '.include | length' <<<"${matrix}")"
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
            echo "source=${source_sha}"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Release package matrix
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_mod-ci.yml
    with:
      app: ${{ matrix.app }}
      mod: ${{ matrix.mod }}
      platforms: ${{ matrix.platforms }}
      source-ref: ${{ needs.plan.outputs.source }}
      publish: true
      moving-tag: edge
      release-version: ${{ matrix.version }}
      release-notes-json: ${{ toJSON(matrix.notes) }}
      candidate-ref: ${{ matrix.candidate_ref }}
      candidate-digest: ${{ matrix.candidate_digest }}
      deployment-environment: release
    secrets: inherit

  complete:
    name: Release / complete
    needs: [plan, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          [[ ${PLAN} == success ]] || { echo "::error::release plan is invalid"; exit 1; }
          case "${PACKAGE}" in success | skipped) ;; *) echo "::error::one or more package releases failed"; exit 1 ;; esac
