name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Discover affected packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      count: ${{ steps.changes.outputs.count }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ ${EVENT} == pull_request ]]; then
            base="${PR_BASE}"
            head="${PR_HEAD}"
          else
            base="${BEFORE}"
            head="${GITHUB_SHA}"
            if [[ -z ${base} || ${base} =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "${head}")"
            fi
          fi
          if [[ ${EVENT} == pull_request ]]; then
            python3 ci/release.py validate --base "${base}" --head "${head}"
          fi
          matrix="$(python3 ci/release.py affected --base "${base}" --head "${head}" | jq -c .)"
          count="$(jq '.include | length' <<<"${matrix}")"
          if git diff --name-only "${base}" "${head}" | grep -qxF '.release/plan.json'; then
            release=true
            if [[ ${EVENT} == pull_request ]]; then
              [[ ${PR_HEAD_REF} == release/next && ${PR_HEAD_REPO} == "${GITHUB_REPOSITORY}" ]] || {
                echo "::error::.release/plan.json may only change through this repository's App-managed release/next branch"
                exit 1
              }
              unexpected="$(git diff --name-only "${base}" "${head}" | grep -Ev \
                '^(\.release/plan\.json|\.changes/[^/]+\.json|mods/[^/]+/[^/]+/(VERSION|CHANGELOG\.md))$' || true)"
              [[ -z ${unexpected} ]] || {
                printf '::error::release/next contains non-generated files:\n%s\n' "${unexpected}"
                exit 1
              }
              if find .changes -maxdepth 1 -name '*.json' -type f | grep -q .; then
                echo "::error::release/next did not consume every change fragment"
                exit 1
              fi
              python3 ci/release.py verify-plan --base "${base}" --owner "${GITHUB_REPOSITORY_OWNER,,}"
            else
              python3 ci/release.py verify-plan --owner "${GITHUB_REPOSITORY_OWNER,,}"
              source_sha="$(jq -r .source_sha .release/plan.json)"
              git merge-base --is-ancestor "${source_sha}" "${head}" || {
                echo "::error::release plan source ${source_sha} is not an ancestor of ${head}"
                exit 1
              }
            fi
          else
            release=false
          fi
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"
          jq . <<<"${matrix}"

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: repository structure and release metadata
        run: |
          ci/check-mod-layout.sh
          ci/check-mod-workflows.sh
          ci/check-shared-files.sh
          python3 -m unittest discover -v ci/tests
          python3 -m py_compile ci/release.py ci/vaapi-fingerprint.py ci/tests/*.py
      - name: shared and package shell scripts
        run: |
          mapfile -t files < <(find ci template shared mods -type f \
            \( -name run -o -name finish -o -name check -o -name '*.sh' \) | sort)
          shellcheck -x "${files[@]}"
      - name: documentation generation is safe
        run: |
          log="${RUNNER_TEMP}/build-docs-guard.log"
          if OUT=mods ci/build-docs.sh >"${log}" 2>&1; then
            echo "::error::ci/build-docs.sh accepted tracked mods/ as output"; exit 1
          fi
          grep -qF 'refusing to replace an existing directory not created by build-docs' "${log}"
          git diff --exit-code -- mods
      - name: template still scaffolds a valid mod
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "${scratch}"' EXIT
          export MODS_DIR="${scratch}/mods" WF_DIR="${scratch}/workflows"
          (umask 0077; ci/new-mod.sh imgname checkme)
          ci/check-mod-layout.sh
          ci/check-mod-workflows.sh
          docker build -q -f "${MODS_DIR}/imgname/checkme/Dockerfile" -t local/scaffold-check "${scratch}" >/dev/null
          layers="$(docker image inspect local/scaffold-check --format '{{len .RootFS.Layers}}')"
          [[ ${layers} == 1 ]]
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: ci/docs-requirements.txt
      - name: documentation builds strictly
        run: |
          python -m pip install -r ci/docs-requirements.txt
          OUT=docs ci/build-docs.sh
          mkdocs build --strict

  mod:
    name: Package matrix
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/_mod-ci.yml
    with:
      app: ${{ matrix.app }}
      mod: ${{ matrix.mod }}
      platforms: ${{ matrix.platforms }}
    secrets: inherit

  edge:
    name: Publish edge matrix
    needs: [changes, repository, mod]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && needs.changes.outputs.release != 'true'
      && needs.changes.outputs.count != '0'
      && needs.repository.result == 'success'
      && (needs.mod.result == 'success' || needs.mod.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_mod-publish.yml
    with:
      app: ${{ matrix.app }}
      mod: ${{ matrix.mod }}
      platforms: ${{ matrix.platforms }}
      run-tests: false
      publish: true
      moving-tag: edge
      candidate-ref: ${{ matrix.candidate_ref }}
      candidate-digest: ${{ matrix.candidate_digest }}
      deployment-environment: release
    secrets: inherit

  required:
    name: CI / required
    needs: [changes, repository, mod, edge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          REPOSITORY: ${{ needs.repository.result }}
          MOD: ${{ needs.mod.result }}
          EDGE: ${{ needs.edge.result }}
        run: |
          [[ ${CHANGES} == success ]] || { echo "::error::affected-package discovery failed"; exit 1; }
          [[ ${REPOSITORY} == success ]] || { echo "::error::repository contracts failed"; exit 1; }
          case "${MOD}" in success | skipped) ;; *) echo "::error::package validation failed"; exit 1 ;; esac
          case "${EDGE}" in success | skipped) ;; *) echo "::error::edge publication failed"; exit 1 ;; esac
