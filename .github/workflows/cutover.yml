name: Remove develop and nightly

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute deletion after the preflight (false is dry-run)
        required: true
        default: false
        type: boolean
      confirm:
        description: Type DELETE_NIGHTLY_AND_DEVELOP for execution
        required: false
        type: string

permissions:
  contents: read

jobs:
  cutover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: cutover
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ '${{ inputs.execute }}' == true ]]; then
            ci/cutover.sh --execute
          else
            ci/cutover.sh
          fi
