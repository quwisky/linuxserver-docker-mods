name: Documentation

on:
  pull_request:
    paths:
      - README.md
      - CHANGELOG.md
      - 'mods/**/README.md'
      - 'mods/**/CHANGELOG.md'
      - mkdocs.yml
      - ci/build-docs.sh
      - ci/docs-requirements.txt
      - .github/workflows/docs.yml
  push:
    branches: [master]
    paths:
      - README.md
      - CHANGELOG.md
      - 'mods/**/README.md'
      - 'mods/**/CHANGELOG.md'
      - mkdocs.yml
      - ci/build-docs.sh
      - ci/docs-requirements.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: ci/docs-requirements.txt
      - run: python -m pip install -r ci/docs-requirements.txt
      - run: |
          OUT=docs ci/build-docs.sh
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
