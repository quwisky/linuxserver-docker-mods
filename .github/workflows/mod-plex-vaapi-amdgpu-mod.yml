name: plex-vaapi-amdgpu-mod

# One workflow per mod. The `paths:` filter is the whole point: GitHub skips
# this entirely unless this mod's own directory changed, so touching one mod
# never runs another's tests.
#
# This mod has TWO schedules, because its image content does not come from git:
# the Dockerfile installs Mesa and libva from alpine:edge at build time, so the
# same commit produces a different image every time it is built.
#
#   nightly  develop -> :nightly   the usual per-mod nightly
#   monthly  main    -> :latest    carried over from the standalone repo, so
#                                  :latest keeps picking up new Mesa releases
#                                  instead of freezing until someone pushes
#
# github.event.schedule holds the cron string that fired, which is how the two
# are told apart below.
#
# Note that GitHub only ever fires scheduled runs from the DEFAULT branch's copy
# of a workflow file, so both of these run from whichever branch is default and
# check their target out explicitly.

on:
  push:
    # Branches only: a tag push would otherwise trigger every mod whose paths
    # happen to match, and build a ref that is not a branch.
    branches: ['**']
    paths:
      - 'mods/plex/vaapi-amdgpu-mod/**'
      - '.github/workflows/mod-plex-vaapi-amdgpu-mod.yml'
      - '.github/workflows/_mod-ci.yml'
  pull_request:
    paths:
      - 'mods/plex/vaapi-amdgpu-mod/**'
      - '.github/workflows/mod-plex-vaapi-amdgpu-mod.yml'
      - '.github/workflows/_mod-ci.yml'
  schedule:
    - cron: '30 5 * * *' # nightly from develop
    - cron: '0 3 1 * *' # monthly from master, for fresh Mesa
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_mod-ci.yml
    with:
      app: plex
      mod: vaapi-amdgpu-mod
      # The monthly cron refreshes master; the nightly cron builds develop;
      # anything else builds whatever ref triggered it.
      ref: >-
        ${{ github.event_name != 'schedule' && github.ref
            || (github.event.schedule == '0 3 1 * *' && 'refs/heads/master' || 'refs/heads/develop') }}
      # develop publishes :nightly, main publishes :latest.
      channel: >-
        ${{ ((github.event_name == 'schedule' && github.event.schedule != '0 3 1 * *')
             || github.ref == 'refs/heads/develop') && 'nightly' || 'release' }}
      # Publish on either schedule, on a push to master, and on a manual run from
      # main or develop. Pushes to feature branches and all PRs test only.
      publish: >-
        ${{ github.event_name == 'schedule'
            || (github.event_name == 'push' && github.ref == 'refs/heads/master')
            || (github.event_name == 'workflow_dispatch'
                && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) }}
      # The drivers are x86_64: the Dockerfile pins --platform=linux/amd64 and
      # the mod links them into Plex's va-dri-linux-x86_64 cache. An arm64 build
      # would be meaningless, not merely redundant.
      platforms: linux/amd64
      # The image is built from alpine:edge, so an unchanged git tree does NOT
      # mean an unchanged image -- deduping on the tree hash would skip exactly
      # the Mesa refresh these schedules exist to deliver.
      dedupe: false
