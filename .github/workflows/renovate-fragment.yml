name: Renovate release intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: [mods/plex/vaapi-amdgpu-mod/Dockerfile]

permissions:
  contents: read
  pull-requests: read

jobs:
  fragment:
    name: Add durable release:none fragment
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is privileged. Never checkout or execute the PR;
      # inspect its file list through the API and write one constant JSON file.
      - name: accept only the VAAPI Dockerfile update
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t files < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files" --jq '.[].filename')
          ((${#files[@]} >= 1))
          for file in "${files[@]}"; do
            case "${file}" in
              mods/plex/vaapi-amdgpu-mod/Dockerfile | .changes/renovate-vaapi-base.json) ;;
              *) echo "::error::unexpected Renovate file: ${file}"; exit 1 ;;
            esac
          done
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: commit release intent without executing pull-request code
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          path='.changes/renovate-vaapi-base.json'
          content="$(jq -n '{
            summary: "Refresh the pinned Alpine base without claiming that shipped VAAPI bytes changed.",
            packages: {"plex-vaapi-amdgpu-mod": "none"}
          }')"
          encoded="$(printf '%s\n' "${content}" | base64 -w0)"
          existing_json="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BRANCH}" 2>/dev/null || true)"
          existing="$(jq -r '.sha // empty' <<<"${existing_json}")"
          current="$(jq -r '.content // empty' <<<"${existing_json}" | tr -d '\n' | base64 -d 2>/dev/null || true)"
          if [[ -n ${existing} && ${current} == "${content}" ]]; then
            echo 'release intent is already current'
            exit 0
          fi
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='chore(release): record Renovate release intent' -f content="${encoded}" -f branch="${BRANCH}")
          if [[ -n ${existing} ]]; then args+=(-f sha="${existing}"); fi
          gh api "${args[@]}" >/dev/null
