name: Prepare release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Update rolling release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: prepare package versions and histories
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mapfile -t fragments < <(find .changes -maxdepth 1 -name '*.json' -type f | sort)
          if ((${#fragments[@]} == 0)); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not plan a later package version while an already merged plan is
          # still incomplete. Infrastructure failures are resumed, not skipped.
          if [[ -f .release/plan.json ]]; then
            while IFS=$'\t' read -r id version; do
              [[ -n ${id} ]] || continue
              state="$(gh release view "${id}/v${version}" --json isDraft --jq .isDraft 2>/dev/null || true)"
              [[ ${state} == false ]] || {
                echo "::error::${id} v${version} is still incomplete; rerun its release before planning another"
                exit 1
              }
            done < <(jq -r '.packages[] | [.id, .version] | @tsv' .release/plan.json)
          fi

          git fetch --no-tags origin '+refs/heads/release/next:refs/remotes/origin/release/next' 2>/dev/null || true
          remote_sha="$(git rev-parse --verify refs/remotes/origin/release/next 2>/dev/null || true)"
          git switch --force-create release/next origin/master
          python3 ci/release.py prepare
          git add .changes .release mods/*/*/VERSION mods/*/*/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'linuxserver-docker-mods-release[bot]'
          git config user.email 'linuxserver-docker-mods-release[bot]@users.noreply.github.com'
          git commit -m 'chore(release): prepare package releases'
          if [[ -n ${remote_sha} ]]; then
            git push --force-with-lease="refs/heads/release/next:${remote_sha}" origin HEAD:release/next
          else
            git push origin HEAD:release/next
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: create or update release pull request
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          body="$(mktemp)"
          trap 'rm -f "${body}"' EXIT
          {
            echo '## What'
            echo
            echo 'Updates independently versioned package histories and records the immutable candidates authorized for promotion.'
            echo
            echo '## Testing'
            echo
            echo 'The required aggregate CI gate validates this release plan before merge. Publication starts only after merge.'
          } >"${body}"
          number="$(gh pr list --state open --head release/next --json number --jq '.[0].number // empty')"
          if [[ -n ${number} ]]; then
            gh pr edit "${number}" --title 'chore(release): prepare package releases' --body-file "${body}"
          else
            gh pr create --base master --head release/next \
              --title 'chore(release): prepare package releases' --body-file "${body}"
          fi
