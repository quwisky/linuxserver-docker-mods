name: Publish edge

# This workflow is loaded only from trusted master. Pull-request workflows have
# no path to package-write, OIDC, attestation, environment, or repository secrets.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  changes:
    name: Discover affected packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="${BEFORE}"
          if [[ -z ${base} || ${base} =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "${GITHUB_SHA}")"
          fi
          matrix="$(python3 ci/release.py affected --runtime-only \
            --base "${base}" --head "${GITHUB_SHA}" | jq -c .)"
          count="$(jq '.include | length' <<<"${matrix}")"
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"
          jq . <<<"${matrix}"

  validate:
    name: Validate edge matrix
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/_mod-ci.yml
    with:
      app: ${{ matrix.app }}
      mod: ${{ matrix.mod }}
      platforms: ${{ matrix.platforms }}

  publish:
    name: Publish edge matrix
    needs: [changes, validate]
    if: >-
      needs.changes.outputs.count != '0'
      && needs.validate.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_mod-publish.yml
    with:
      app: ${{ matrix.app }}
      mod: ${{ matrix.mod }}
      platforms: ${{ matrix.platforms }}
      run-tests: false
      publish: true
      moving-tag: edge
      deployment-environment: release
    secrets: inherit
