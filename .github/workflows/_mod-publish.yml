name: Mod publish

# Trusted publication pipeline. Pull requests call _mod-ci.yml, which has no
# package-write or attestation capability. Master/release callers come here only
# after read-only validation succeeds.
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      mod:
        required: true
        type: string
      platforms:
        required: false
        default: linux/amd64,linux/arm64
        type: string
      source-ref:
        required: false
        default: ''
        type: string
      run-tests:
        required: false
        default: true
        type: boolean
      publish:
        required: false
        default: false
        type: boolean
      moving-tag:
        required: false
        default: edge
        type: string
      candidate-tag:
        required: false
        default: ''
        type: string
      release-version:
        required: false
        default: ''
        type: string
      release-notes-json:
        required: false
        default: ''
        type: string
      candidate-ref:
        required: false
        default: ''
        type: string
      candidate-digest:
        required: false
        default: ''
        type: string
      deployment-environment:
        required: false
        default: release
        type: string
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

jobs:
  test:
    name: ${{ inputs.app }}-${{ inputs.mod }} / test
    if: inputs.run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DIR: mods/${{ inputs.app }}/${{ inputs.mod }}
      ID: ${{ inputs.app }}-${{ inputs.mod }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - name: mod directory exists and is shaped like a mod
        run: |
          rc=0
          [[ -f "${DIR}/Dockerfile" ]] || { echo "::error::${ID}: no Dockerfile"; rc=1; }
          [[ -f "${DIR}/README.md" ]] || { echo "::error::${ID}: no README.md"; rc=1; }
          [[ -f "${DIR}/VERSION" ]] || { echo "::error::${ID}: no VERSION"; rc=1; }
          [[ -f "${DIR}/CHANGELOG.md" ]] || { echo "::error::${ID}: no CHANGELOG.md"; rc=1; }
          [[ -d "${DIR}/root/etc/s6-overlay/s6-rc.d" ]] || { echo "::error::${ID}: no s6-rc.d"; rc=1; }
          exit "${rc}"

      - name: s6 scripts must be executable
        run: |
          bad="$(find "${DIR}" \( -name run -o -name finish -o -name check \) -not -perm -u=x,g=x,o=x -print)"
          [[ -z ${bad} ]] || { printf '::error::non-executable s6 files:\n%s\n' "${bad}"; exit 1; }

      - name: every service must have a type and user registration
        run: |
          directory="${DIR}/root/etc/s6-overlay/s6-rc.d"
          rc=0
          for service in "${directory}"/*/; do
            name="$(basename "${service%/}")"
            case "${name}" in user | user2 | init-mods* | legacy-services) continue ;; esac
            [[ -f "${service}type" ]] || { echo "::error::${name} has no type"; rc=1; }
            ls "${directory}"/user*/contents.d/"${name}" >/dev/null 2>&1 || {
              echo "::error::${name} is not registered in user/contents.d"; rc=1;
            }
          done
          exit "${rc}"

      - name: s6 files must be UTF-8 with LF and no BOM
        run: |
          rc=0
          if crlf="$(grep -rlU $'\r' "${DIR}/root/" || true)" && [[ -n ${crlf} ]]; then
            printf '::error::CRLF files:\n%s\n' "${crlf}"; rc=1
          fi
          if bom="$(LC_ALL=C grep -rl $'\xEF\xBB\xBF' "${DIR}/root/" || true)" && [[ -n ${bom} ]]; then
            printf '::error::BOM files:\n%s\n' "${bom}"; rc=1
          fi
          exit "${rc}"

      - name: shellcheck
        run: |
          mapfile -t files < <(find "${DIR}" -type f \( -name run -o -name finish -o -name check -o -name '*.sh' \) | sort)
          ((${#files[@]} == 0)) || shellcheck -x "${files[@]}"

      - name: unit tests
        run: |
          test_file="${DIR}/test/run_tests.sh"
          [[ -f ${test_file} ]] || exit 0
          bash "${test_file}"
          NO_JQ=1 bash "${test_file}"

      - name: validate Caddy stubs
        run: |
          directory="${DIR}/test/stubs"
          if [[ ! -d ${directory} ]] || ! compgen -G "${directory}/Caddyfile.*" >/dev/null; then exit 0; fi
          docker run --rm -v "$PWD/${directory}:/s:ro" -w /s --entrypoint sh caddy:2-alpine -c '
            rc=0
            for file in Caddyfile.*; do caddy validate --adapter caddyfile --config "$file" || rc=1; done
            exit $rc'

      - name: end-to-end smoke test
        run: |
          smoke="${DIR}/test/smoke.sh"
          [[ -f ${smoke} ]] || exit 0
          bash "${smoke}"

      - uses: docker/setup-buildx-action@v4

      - name: build and verify the local layer
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          docker buildx build --load --provenance=false \
            --platform "${PLATFORMS%%,*}" -f "${DIR}/Dockerfile" -t "local/${ID}:test" .
          layers="$(docker image inspect "local/${ID}:test" --format '{{len .RootFS.Layers}}')"
          [[ ${layers} == 1 ]] || { echo "::error::${ID} produced ${layers} layers"; exit 1; }
          docker create --name probe "local/${ID}:test" /nonexistent >/dev/null
          trap 'docker rm -f probe >/dev/null 2>&1 || true' EXIT
          docker export probe | tar -tf - \
            | grep -vE '^(dev|proc|sys)/|^\.dockerenv$|^etc/(hostname|hosts|mtab|resolv.conf)$|/$' | sort

  publish:
    name: ${{ inputs.app }}-${{ inputs.mod }} / publish
    needs: test
    if: inputs.publish && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DIR: mods/${{ inputs.app }}/${{ inputs.mod }}
      ID: ${{ inputs.app }}-${{ inputs.mod }}
      PLATFORMS: ${{ inputs.platforms }}
      MOVING_TAG: ${{ inputs.moving-tag }}
      RELEASE_VERSION: ${{ inputs.release-version }}
      PROVIDED_REF: ${{ inputs.candidate-ref }}
      PROVIDED_DIGEST: ${{ inputs.candidate-digest }}
      CANDIDATE_TAG: ${{ inputs.candidate-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: record checked-out source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve immutable candidate
        id: candidate
        env:
          OWNER: ${{ steps.owner.outputs.name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          package="ghcr.io/${OWNER}/${ID}"
          if [[ -n ${PROVIDED_REF} || -n ${PROVIDED_DIGEST} ]]; then
            [[ -n ${PROVIDED_REF} && -n ${PROVIDED_DIGEST} ]] || {
              echo "::error::candidate-ref and candidate-digest must be supplied together"; exit 1;
            }
            [[ ${PROVIDED_REF} == "${package}:"* && ${PROVIDED_REF} != *@* ]] || {
              echo "::error::candidate-ref must be a tag in ${package}"; exit 1;
            }
            candidate="${PROVIDED_REF}"
            digest="${PROVIDED_DIGEST}"
            docker buildx imagetools inspect "${candidate}@${digest}" >/dev/null
            build=false
          else
            if [[ -n ${CANDIDATE_TAG} ]]; then
              [[ ${CANDIDATE_TAG} == "test-${SOURCE_SHA:0:12}" ]] || {
                echo "::error::candidate-tag must match the selected source commit"; exit 1;
              }
              candidate="${package}:${CANDIDATE_TAG}"
            else
              candidate="${package}:sha-${SOURCE_SHA}"
            fi
            if inspection="$(docker buildx imagetools inspect "${candidate}" 2>/dev/null)"; then
              digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"${inspection}")"
              [[ ${digest} == sha256:* ]] || { echo "::error::could not resolve ${candidate}"; exit 1; }
              build=false
            else
              digest=''
              build=true
            fi
          fi
          {
            echo "package=${package}"
            echo "ref=${candidate}"
            echo "digest=${digest}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: build
        if: steps.candidate.outputs.build == 'true'
        with:
          context: .
          file: ${{ env.DIR }}/Dockerfile
          platforms: ${{ inputs.platforms }}
          provenance: false
          outputs: type=image,push=true,oci-mediatypes=${{ contains(inputs.platforms, ',') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.title=${{ env.ID }}
          tags: ${{ steps.candidate.outputs.ref }}

      - name: capture and verify candidate digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE: ${{ steps.candidate.outputs.ref }}
          RESOLVED_DIGEST: ${{ steps.candidate.outputs.digest }}
          GH_USER: ${{ github.actor }}
          GH_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest="${BUILT_DIGEST:-${RESOLVED_DIGEST}}"
          [[ ${digest} == sha256:* ]] || { echo "::error::candidate digest is missing"; exit 1; }
          docker buildx imagetools inspect "${CANDIDATE}@${digest}" >/dev/null
          ci/verify-published-mod.sh "${CANDIDATE}@${digest}"
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: promote the verified digest
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.candidate.outputs.package }}
          CANDIDATE: ${{ steps.candidate.outputs.ref }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          source="${CANDIDATE}@${DIGEST}"
          tags=("${MOVING_TAG}")
          options=()
          [[ ${PLATFORMS} == *,* ]] || options+=(--prefer-index=false)
          if [[ -n ${RELEASE_VERSION} ]]; then
            [[ ${RELEASE_VERSION} =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
              echo "::error::release-version is not SemVer"; exit 1;
            }
            release_major="${BASH_REMATCH[1]}"
            release_minor="${BASH_REMATCH[2]}"
            git_tag="${ID}/v${RELEASE_VERSION}"
            existing_git="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${git_tag}" --jq .object.sha 2>/dev/null || true)"
            if [[ -n ${existing_git} && ${existing_git} != "${GITHUB_SHA}" ]]; then
              echo "::error::${git_tag} already points at ${existing_git}, not ${GITHUB_SHA}"; exit 1
            fi
            exact="${PACKAGE}:${RELEASE_VERSION}"
            if inspection="$(docker buildx imagetools inspect "${exact}" 2>/dev/null)"; then
              existing_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"${inspection}")"
              [[ ${existing_digest} == "${DIGEST}" ]] || {
                echo "::error::immutable ${exact} is ${existing_digest}, not ${DIGEST}"; exit 1;
              }
            else
              docker buildx imagetools create "${options[@]}" --tag "${exact}" "${source}"
              ci/verify-published-mod.sh "${exact}"
            fi
            tags+=("${release_major}.${release_minor}" "${release_major}" latest)
          fi
          for tag in "${tags[@]}"; do
            target="${PACKAGE}:${tag}"
            if [[ ${target} != "${CANDIDATE}" ]]; then
              docker buildx imagetools create "${options[@]}" --tag "${target}" "${source}"
            fi
            ci/verify-published-mod.sh "${target}"
            printf '%s\n' "${target}"
          done

      - uses: anchore/sbom-action@v0
        if: inputs.release-version != ''
        with:
          image: ${{ steps.candidate.outputs.ref }}@${{ steps.digest.outputs.value }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ env.ID }}-${{ env.RELEASE_VERSION }}-sbom.spdx.json

      - uses: actions/attest-build-provenance@v3
        if: steps.candidate.outputs.build == 'true'
        with:
          subject-name: ${{ steps.candidate.outputs.package }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - uses: actions/attest-sbom@v3
        if: inputs.release-version != ''
        with:
          subject-name: ${{ steps.candidate.outputs.package }}
          subject-digest: ${{ steps.digest.outputs.value }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: actions/create-github-app-token@v3
        id: release-token
        if: inputs.release-version != ''
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: publish the package-scoped GitHub Release
        if: inputs.release-version != ''
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PACKAGE: ${{ steps.candidate.outputs.package }}
          DIGEST: ${{ steps.digest.outputs.value }}
          NOTES_JSON: ${{ inputs.release-notes-json }}
        run: |
          tag="${ID}/v${RELEASE_VERSION}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)"
          if [[ -n ${existing} && ${existing} != "${GITHUB_SHA}" ]]; then
            echo "::error::${tag} already points at ${existing}, not ${GITHUB_SHA}"; exit 1
          fi
          if [[ -z ${existing} ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" >/dev/null
          fi
          notes_file="${RUNNER_TEMP}/${ID}-release.md"
          notes="$(jq -r 'join("\n\n")' <<<"${NOTES_JSON}")"
          {
            printf '%s\n\n' "${notes}"
            printf '%s\n' '### Image'
            # shellcheck disable=SC2016
            printf -- '- `%s:%s`\n' "${PACKAGE}" "${RELEASE_VERSION}"
            # shellcheck disable=SC2016
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            # shellcheck disable=SC2016
            printf -- '- Platforms: `%s`\n' "${PLATFORMS}"
            # shellcheck disable=SC2016
            printf -- '- Source: `%s`\n' "${GITHUB_SHA}"
          } >"${notes_file}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --draft --title "${ID} v${RELEASE_VERSION}" --notes-file "${notes_file}"
          else
            gh release create "${tag}" --verify-tag --draft --title "${ID} v${RELEASE_VERSION}" --notes-file "${notes_file}"
          fi
          gh release upload "${tag}" sbom.spdx.json --clobber
          gh release edit "${tag}" --draft=false

      - name: summary
        env:
          PACKAGE: ${{ steps.candidate.outputs.package }}
          CANDIDATE: ${{ steps.candidate.outputs.ref }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          {
            echo "### ${ID}"
            echo "- Candidate: \`${CANDIDATE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Moving tag: \`${MOVING_TAG}\`"
            if [[ -n ${RELEASE_VERSION} ]]; then echo "- Release: \`${RELEASE_VERSION}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: prune old unreleased candidates
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/cleanup-package-tags.sh "${ID}" candidates 20
