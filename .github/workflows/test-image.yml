name: Publish test image

on:
  repository_dispatch:
    types: [publish-test-image]

permissions:
  contents: read

concurrency:
  group: test-image-${{ github.event.client_payload.app }}-${{ github.event.client_payload.mod }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.package.outputs.app }}
      mod: ${{ steps.package.outputs.mod }}
      platforms: ${{ steps.package.outputs.platforms }}
      tag: ${{ steps.package.outputs.tag }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.ref }}
          persist-credentials: false
      - id: package
        env:
          APP: ${{ github.event.client_payload.app }}
          MOD: ${{ github.event.client_payload.mod }}
          SOURCE_REF: ${{ github.event.client_payload.ref }}
        run: |
          [[ -n ${APP} && -n ${MOD} && -n ${SOURCE_REF} ]] || {
            echo "::error::app, mod, and ref are required"; exit 1;
          }
          package="$(python3 ci/release.py packages | jq -c --arg app "${APP}" --arg mod "${MOD}" '.[] | select(.app == $app and .mod == $mod)')"
          [[ -n ${package} ]] || { echo "::error::unknown package ${APP}/${MOD}"; exit 1; }
          sha="$(git rev-parse HEAD)"
          {
            echo "app=${APP}"
            echo "mod=${MOD}"
            echo "platforms=$(jq -r .platforms <<<"${package}")"
            echo "tag=test-${sha:0:12}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_mod-publish.yml
    with:
      app: ${{ needs.resolve.outputs.app }}
      mod: ${{ needs.resolve.outputs.mod }}
      platforms: ${{ needs.resolve.outputs.platforms }}
      source-ref: ${{ needs.resolve.outputs.sha }}
      publish: true
      moving-tag: ${{ needs.resolve.outputs.tag }}
      candidate-tag: ${{ needs.resolve.outputs.tag }}
      deployment-environment: test-publish
    secrets: inherit

  cleanup:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    environment: test-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ needs.resolve.outputs.app }}-${{ needs.resolve.outputs.mod }}
        run: ci/cleanup-package-tags.sh "${PACKAGE}" test 5
