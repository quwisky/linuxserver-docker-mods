site_name: LinuxServer Docker Mods
site_description: Docker Mods for LinuxServer.io containers, grouped by application.
site_url: !ENV [SITE_URL, 'https://quwisky.github.io/linuxserver-docker-mods/']
repo_url: https://github.com/quwisky/linuxserver-docker-mods
repo_name: quwisky/linuxserver-docker-mods
edit_uri: ""

# docs/ is generated by ci/build-docs.sh from the repo's READMEs and is
# git-ignored. Do not edit it; edit the README the page came from.
docs_dir: docs

# No `nav`: pages are discovered from the generated tree, so adding a mod does
# not also mean remembering to edit this file. Ordering is alphabetical, with
# index.md first.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/quwisky/linuxserver-docker-mods
